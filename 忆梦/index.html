<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>忆梦</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317181B'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle' fill='%23F2F2EF' font-family='serif'%3E忆%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/index.css">
</head>
<body>
<div class="app home">

  <!-- ===== 顶部 ===== -->
  <header class="home-top">
    <div class="brand">
      <h1 class="brand-word">忆梦</h1>
      <svg class="brand-mark" viewBox="0 0 40 12" aria-hidden="true">
        <path d="M1 6h26" stroke="currentColor" stroke-width="1" opacity="0.35"/>
        <circle cx="32" cy="6" r="2.4" stroke="currentColor" stroke-width="1" fill="none" opacity="0.6"/>
      </svg>
    </div>
    <button class="icon-btn dim" id="btnTheme" aria-label="切换主题"></button>
  </header>

  <!-- ===== 桌面图标 ===== -->
  <main class="desk">
    <ul class="icon-grid" id="iconGrid">

      <li class="icon-cell" style="--i:0">
        <a class="app-icon" href="pages/sessions.html" aria-label="忆梦">
          <span class="icon-tile">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <path d="M6 8.5A2.5 2.5 0 0 1 8.5 6h15A2.5 2.5 0 0 1 26 8.5v10A2.5 2.5 0 0 1 23.5 21H14l-5 4v-4h-0.5A2.5 2.5 0 0 1 6 18.5z"/>
              <path d="M19.5 9.2a3.2 3.2 0 1 0 3.4 4.6 3.6 3.6 0 0 1-3.4-4.6z" fill="currentColor" opacity="0.55" stroke="none"/>
              <path d="M11 12.5h4.5M11 16h3" opacity="0.55"/>
            </svg>
          </span>
          <span class="icon-label">忆梦</span>
        </a>
      </li>

      <li class="icon-cell" style="--i:1">
        <a class="app-icon" href="pages/letters.html" aria-label="信笺">
          <span class="icon-tile">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <rect x="6.5" y="9" width="19" height="14" rx="1.8"/>
              <path d="M6.5 10.4L16 17.6l9.5-7.2"/>
              <path d="M6.5 21.4l6.6-5M25.5 21.4l-6.6-5" opacity="0.45"/>
            </svg>
          </span>
          <span class="icon-label">信笺</span>
        </a>
      </li>

      <li class="icon-cell" style="--i:2">
        <a class="app-icon" href="pages/cards.html" aria-label="字卡库">
          <span class="icon-tile">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <rect x="7" y="10" width="18" height="12" rx="2.2" opacity="0.4" transform="rotate(-6 16 16)"/>
              <rect x="7" y="10" width="18" height="12" rx="2.2" opacity="0.7" transform="rotate(-2 16 16)"/>
              <rect x="7" y="10" width="18" height="12" rx="2.2"/>
              <path d="M10 14h8M10 17.5h5" opacity="0.6"/>
            </svg>
          </span>
          <span class="icon-label">字卡库</span>
        </a>
      </li>

      <li class="icon-cell" style="--i:3">
        <a class="app-icon" href="pages/settings.html" aria-label="设置">
          <span class="icon-tile">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <circle cx="16" cy="16" r="3.6"/>
              <path d="M16 6.5v2.2M16 23.3v2.2M6.5 16h2.2M23.3 16h2.2M9.6 9.6l1.6 1.6M20.8 20.8l1.6 1.6M22.4 9.6l-1.6 1.6M11.2 20.8l-1.6 1.6"/>
              <circle cx="16" cy="16" r="8.2" opacity="0.3"/>
            </svg>
          </span>
          <span class="icon-label">设置</span>
        </a>
      </li>

      <li class="icon-cell" style="--i:4">
        <a class="app-icon" href="pages/tide.html" aria-label="潮汐">
          <span class="icon-tile">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <circle cx="21.5" cy="10.5" r="3.6" opacity="0.5"/>
              <path d="M6 17.5c2.6-2.4 5.2-2.4 7.8 0s5.2 2.4 7.8 0 5.2-2.4 7.8 0"/>
              <path d="M6 22.6c2.6-2.4 5.2-2.4 7.8 0s5.2 2.4 7.8 0 5.2-2.4 7.8 0" opacity="0.45"/>
            </svg>
          </span>
          <span class="icon-label">潮汐</span>
        </a>
      </li>

      <li class="icon-cell" style="--i:5">
        <a class="app-icon" href="pages/mirror.html" aria-label="共鉴">
          <span class="icon-tile">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <circle cx="12.4" cy="16" r="5.8"/>
              <circle cx="19.6" cy="16" r="5.8" opacity="0.45"/>
              <path d="M17.2 16h1.2" opacity="0.5"/>
            </svg>
          </span>
          <span class="icon-label">共鉴</span>
        </a>
      </li>

      <li class="icon-cell" style="--i:6">
        <a class="app-icon" href="pages/sync.html" aria-label="共时">
          <span class="icon-tile">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <circle cx="16" cy="16" r="9"/>
              <path d="M16 10.4v6l3.8 2.6"/>
              <path d="M16 5.6v2.2M16 24.2v2.2M5.6 16h2.2M24.2 16h2.2" opacity="0.4"/>
            </svg>
          </span>
          <span class="icon-label">共时</span>
        </a>
      </li>

      <li class="icon-cell" style="--i:7">
        <a class="app-icon" href="pages/resonance.html" aria-label="共振">
          <span class="icon-tile">
            <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
              <circle cx="16" cy="16" r="2.2"/>
              <path d="M12.2 10.8a7 7 0 0 0 0 10.4" opacity="0.7"/>
              <path d="M19.8 10.8a7 7 0 0 1 0 10.4" opacity="0.7"/>
              <path d="M8.4 7a12 12 0 0 0 0 18" opacity="0.4"/>
              <path d="M23.6 7a12 12 0 0 1 0 18" opacity="0.4"/>
            </svg>
          </span>
          <span class="icon-label">共振</span>
        </a>
      </li>

    </ul>
  </main>

  <!-- ===== 底部留白线 ===== -->
  <footer class="home-foot">
    <span class="foot-line"></span>
  </footer>

  <!-- ===== 开场动画 ===== -->
  <div class="opening" id="opening" aria-hidden="true">
    <div class="opening-inner">
      <span class="opening-word" id="openingWord">忆梦</span>
      <span class="opening-rule"></span>
    </div>
  </div>

</div>

<script src="js/common.js"></script>
<script src="js/index.js"></script>
</body>
</html>
